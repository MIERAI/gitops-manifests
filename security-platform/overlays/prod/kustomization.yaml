apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security-platform-prod
resources:
  - ../../base
  - dashboard.yaml        # the laptop's Grafana picks it up (sidecar label grafana_dashboard)
  - ../../hub             # the in-cluster hub (after the lab run)
  - sites.yaml
configMapGenerator:
  - { name: security-platform-hub, files: [instance.json=hub.json] }
generatorOptions: { disableNameSuffixHash: true }
