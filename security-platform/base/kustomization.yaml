# The product's Kubernetes manifests at a pinned commit (the metrics exporter: Deployment, Service, ServiceMonitor,
# NetworkPolicy) + the generated regression alert rules. Upgrade = change ref and newTag together.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/MIERAI/security-platform//deploy/kubernetes?ref=49d2f82f8340ea543d48c0446e65dd00a981e8cf
  - rules.yaml
images:
  - { name: security-platform, newName: ghcr.io/mierai/security-platform, newTag: 49d2f82 }
