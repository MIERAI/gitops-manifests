# The product's Kubernetes manifests at a pinned commit (the metrics exporter: Deployment, Service, ServiceMonitor,
# NetworkPolicy) + the generated regression alert rules. Upgrade = change ref and newTag together.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/MIERAI/security-platform//deploy/kubernetes?ref=54c24adaf1e25913a16d1a3773d75b04b822b47f
  - rules.yaml
images:
  - { name: security-platform, newName: ghcr.io/mierai/security-platform, newTag: 54c24ad }
