# The product's Kubernetes manifests at a pinned commit (the metrics exporter: Deployment, Service, ServiceMonitor,
# NetworkPolicy) + the generated regression alert rules. Upgrade = change ref and newTag together.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/MIERAI/security-platform//deploy/kubernetes?ref=75eb5d42b031f6b6599d3321345c0eba450781bf
  - rules.yaml
images:
  - { name: security-platform, newName: ghcr.io/mierai/security-platform, newTag: 75eb5d4 }
