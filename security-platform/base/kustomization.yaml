# The product's Kubernetes manifests at a pinned commit (the metrics exporter: Deployment, Service, ServiceMonitor,
# NetworkPolicy) + the generated regression alert rules. Upgrade = change ref and newTag together.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/MIERAI/security-platform//deploy/kubernetes?ref=65cd3b042e1151a3d1dfef90bdb6c8395a2c4d91
  - rules.yaml
images:
  - { name: security-platform, newName: ghcr.io/mierai/security-platform, newTag: 65cd3b0 }
