# Temporary: the laptop keeps these until the lab change has soaked; a follow-up removes this file.
apiVersion: v1
kind: Service
metadata: { name: prometheus-ui, namespace: monitoring }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: prometheus, operator.prometheus.io/name: kps-prometheus }
  ports: [{ name: http, port: 9090, targetPort: 9090, nodePort: 30087 }]
---
apiVersion: v1
kind: Service
metadata: { name: alertmanager-ui, namespace: monitoring }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: alertmanager, alertmanager: kps-alertmanager }
  ports: [{ name: http, port: 9093, targetPort: 9093, nodePort: 30088 }]
---
apiVersion: v1
kind: Service
metadata: { name: pyrra-ui, namespace: monitoring }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: pyrra, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 9099, targetPort: 9099, nodePort: 30089 }]
