apiVersion: v1
kind: Service
metadata: { name: argocd-server-ui, namespace: argocd }
spec:
  type: NodePort
  selector: { app.kubernetes.io/instance: argocd, app.kubernetes.io/name: argocd-server }
  ports: [{ name: http, port: 80, targetPort: 8080, nodePort: 30085 }]   # server.insecure: plain HTTP
