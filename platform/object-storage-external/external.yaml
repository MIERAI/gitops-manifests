apiVersion: v1
kind: Service
metadata: { name: seaweedfs }
spec:
  ports: [{ name: s3, port: 8333, targetPort: 8333 }]   # no selector: endpoints below
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: seaweedfs-host
  labels: { kubernetes.io/service-name: seaweedfs }
addressType: IPv4
ports: [{ name: s3, port: 8333, protocol: TCP }]
# host's cni0 address. conditions written out: the API server adds an empty `conditions: {}`, which Argo CD
# otherwise reports as a permanent difference
endpoints: [{ addresses: ["10.42.0.1"], conditions: { ready: true } }]
