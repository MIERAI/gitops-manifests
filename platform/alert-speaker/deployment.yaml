apiVersion: apps/v1
kind: Deployment
metadata: { name: alert-speaker }
spec:
  replicas: 1
  selector: { matchLabels: { app: alert-speaker } }
  template:
    metadata: { labels: { app: alert-speaker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: speaker
          image: python:3.13.17-alpine3.24
          command: [python3, -I, -B, /app/speaker.py, "8080"]
          env:
            - { name: SPEAKD_URL, value: "http://10.42.0.1:8770/" }   # speakd on the host (listens on all interfaces)
            - { name: QUIET_HOURS, value: "23-8" }                    # JST: logged, not spoken
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: app, mountPath: /app, readOnly: true }]
      volumes: [{ name: app, configMap: { name: alert-speaker } }]
---
apiVersion: v1
kind: Service
metadata: { name: alert-speaker }
spec:
  selector: { app: alert-speaker }
  ports: [{ name: http, port: 8080, targetPort: http }]
