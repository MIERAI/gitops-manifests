# The scheduled regression (scripts/experiment-regression.py): every experiment, daily, in waves (one queue per
# namespace). The runner is the repository itself, cloned at main when the job starts: the experiments and scripts
# that run are exactly what is merged (the same revision Argo CD syncs), with no copy to keep in step. Image:
# alpine/k8s (kubectl, python3 + PyYAML, git in one pinned upstream image; ~1 GB, pulled once per node).
# A full run takes ~9 h (storefront-dev: 7 experiments, 45 min apart). The lab cluster (clusters/lab, xiaoxin) is
# always on; on kind (a Mac) a Mac asleep at 09:00 runs it when it wakes (startingDeadlineSeconds), or the run is
# missed and SLOExperimentRegressionStale says so after 2 days.
# By hand: kubectl -n slo-experiments create job --from=cronjob/experiment-regression regression-$(date +%s)
apiVersion: batch/v1
kind: CronJob
metadata: { name: experiment-regression, namespace: slo-experiments }
spec:
  schedule: "0 9 * * *"
  timeZone: Asia/Tokyo
  startingDeadlineSeconds: 21600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0                  # a second attempt would start the faults all over again: next day
      activeDeadlineSeconds: 50400     # 14 h; on SIGTERM every running fault is removed (terminationGracePeriodSeconds)
      template:
        spec:
          serviceAccountName: experiment-runner
          restartPolicy: Never
          terminationGracePeriodSeconds: 180
          securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: regression
              image: alpine/k8s:1.36.5
              command:
                - sh
                - -c
                - >-
                  set -e;
                  git clone -q --depth 1 --branch main "$REPO" /tmp/repo;
                  cd /tmp/repo; echo "gitops-manifests $(git rev-parse --short HEAD)";
                  exec python3 -I -B scripts/experiment-regression.py --cluster "$CLUSTER" --record slo-experiments/experiment-results
              env:
                - { name: REPO, value: "https://github.com/MIERAI/gitops-manifests.git" }   # scripts/fork.sh rewrites it
                - { name: HOME, value: /tmp }
                - { name: PYTHONUNBUFFERED, value: "1" }
                - { name: CLUSTER, value: kind }   # checked against the nodes; platform/experiments-lab: lab
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts: [{ name: tmp, mountPath: /tmp }]
          volumes: [{ name: tmp, emptyDir: { sizeLimit: 256Mi } }]
