# Log shipping on the laptop (base: ../log-shipping): the cluster label of every line.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../log-shipping]
patches:
  - target: { kind: Deployment, name: alloy }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: laptop
      # the lab's 1h soak peaked at 153Mi working set (limit 192Mi); the laptop has ~2x the pods: more headroom
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: 220MiB
      # Loki through the phone's auth proxy (ENVIRONMENTS.md 4.11): its port and a Bearer token (secret phone-auth-logs,
      # infrastructure-live tofu); :3100 itself only listens on the phone's 127.0.0.1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: http://100.80.225.15:13100/loki/api/v1/push
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: LOKI_TOKEN, valueFrom: { secretKeyRef: { name: phone-auth-logs, key: token } } }
