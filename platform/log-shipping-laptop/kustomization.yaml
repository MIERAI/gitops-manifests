# Log shipping on the laptop (base: ../log-shipping): the cluster label of every line.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../log-shipping]
patches:
  - target: { kind: Deployment, name: alloy }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: laptop
