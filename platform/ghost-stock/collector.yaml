# The play-statistics collector runs on the macbook (ghost-stock repo ops/beacon/collector.py, launchd
# local.ghost-stock.beacon): the game page sends anonymous beacons to it through Tailscale Funnel (/gs-beacon), and it
# exports counters on the tailnet (100.83.5.62:9798). A ScrapeConfig (static target) has the laptop's Prometheus scrape
# it — not a Service + Endpoints: Argo CD excludes Endpoints / EndpointSlices by default, so they never sync. The
# release label is what the Prometheus' scrapeConfigSelector matches (kube-prometheus-stack default).
# macbook off = the target is down (no data; the page never waits for the beacon).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: ghost-stock-collector
  labels: { release: platform-monitoring }
spec:
  staticConfigs:
    - targets: ["100.83.5.62:9798"]
      labels: { instance: macbook, job: ghost-stock-collector }
  metricsPath: /metrics
  scrapeInterval: 60s
