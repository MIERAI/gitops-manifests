# The play-statistics collector runs on the macbook (ghost-stock repo ops/beacon/collector.py, launchd
# local.ghost-stock.beacon): the game page sends anonymous beacons to it through Tailscale Funnel (/gs-beacon), and it
# exports counters on the tailnet (100.83.5.62:9798). Here: a selectorless Service + Endpoints pointing at it, and a
# ServiceMonitor so the laptop's Prometheus scrapes it. macbook off = the target is down (no data, nothing lost on the
# page: it never waits for the beacon).
apiVersion: v1
kind: Service
metadata:
  name: ghost-stock-collector
  labels: { app.kubernetes.io/name: ghost-stock-collector }
spec:
  clusterIP: None
  ports: [{ name: metrics, port: 9798, targetPort: 9798 }]
---
apiVersion: v1
kind: Endpoints
metadata:
  name: ghost-stock-collector
  labels: { app.kubernetes.io/name: ghost-stock-collector }
subsets:
  - addresses: [{ ip: 100.83.5.62 }]
    ports: [{ name: metrics, port: 9798 }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ghost-stock-collector
spec:
  selector: { matchLabels: { app.kubernetes.io/name: ghost-stock-collector } }
  endpoints:
    - port: metrics
      interval: 60s
      relabelings: [{ targetLabel: instance, replacement: macbook }]
