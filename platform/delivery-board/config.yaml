# Pipelines of the delivery board (MIERAI/delivery-board; format and templates: its README). Mounted at
# /etc/delivery-board. Expanded: delivery-board -print-config -config config.yaml
title: 交付看板
timezone: Asia/Tokyo
interval: 30s
maxRuns: 12

pipelines:
  - id: api-factory
    title: api-factory
    repo: MIERAI/api-factory
    changes:
      - label: 设计书
        head: ^(design|review)/
        title: ^design
        items: ^design/[^/]+/([A-Z][A-Za-z0-9]+)\.yaml$       # one design file = one API
        steps:
          - { stage: 设计书, name: AI 审查, workflow: spec-pr, failureNeedsPerson: true, personNote: 有问题要回答 }
          - { stage: 设计书, name: 设计书合并, merge: true }
          - { stage: 生成, name: 生成, workflow: generate, jobs: { generate: 生成, "verify / verify": verify } }
          - { stage: 生成, name: 生成 PR 合并, followPR: ^factory/gen-$(sha7)$ }
    push: { label: 工厂 }                                        # commits to main that are not a design change
    release:
      name: release
      jobs: { "verify / verify": verify, "image-api / build": API 镜像, "image-schema / build": 迁移镜像, "promote / promote": 推送 dev }
    defaults:
      environment:
        manifests: { repo: MIERAI/gitops-manifests, path: api-factory/overlays/$(env)/kustomization.yaml, image: ghcr.io/mierai/api-factory }
        argocd: { app: api-factory-$(env) }
        workload: { namespace: api-factory-$(env), kind: Deployment, name: api-factory, container: api }
    environments:
      - { name: dev, url: "http://100.90.245.89:30080" }
      - name: prod
        url: http://100.90.245.89:30081
        promotion:
          from: dev
          soak: 10m
          prTitle: ^promote api-factory
          workflow: { file: promote.yml, inputs: { app: api-factory }, soakInput: soak }
    try:
      catalog: gen/api-catalog.json
      env: dev
      internalURL: http://api-factory.api-factory-dev.svc:8080
      tokenEnv: DEV_TOKEN
      curlToken: $(cat ~/workspace/gitops/infrastructure-live/.secrets/laptop/api-factory-dev.token)

  - id: sample-app
    title: sample-app
    repo: MIERAI/sample-app
    push: { label: 提交 }
    release:
      name: ci
      jobs: { test: test, "image / build": 镜像, "promote / promote": 推送 dev }
    defaults:
      environment:
        manifests: { repo: MIERAI/gitops-manifests, path: sample-app/overlays/$(env)/kustomization.yaml, image: ghcr.io/mierai/sample-app }
        argocd: { app: sample-app-$(env) }
        workload: { namespace: sample-app-$(env), kind: Rollout, name: sample-app, container: app }
    environments:
      - { name: dev, url: "http://100.90.245.89:30082" }
      - name: prod
        url: http://100.90.245.89:30083
        promotion:
          from: dev
          soak: 10m
          prTitle: ^promote sample-app
          workflow: { file: promote.yml, inputs: { app: sample-app }, soakInput: soak }

  # monorepo: one pipeline per service (storefront-web, storefront-api), each released and promoted on its own
  - id: storefront
    title: storefront
    repo: MIERAI/storefront
    services: [web, api]
    push: { label: 提交 }
    release:
      name: release-$(service)                # runs only for changes under services/$(service)
      jobs: { test: test, "image / build": 镜像, "promote / promote": 推送 dev }
    defaults:
      environment:
        manifests: { repo: MIERAI/gitops-manifests, path: storefront/overlays/$(env)/kustomization.yaml, image: ghcr.io/mierai/storefront-$(service) }
        argocd: { app: storefront-$(env) }
        workload: { namespace: storefront-$(env), kind: Deployment, name: $(service), container: $(service) }
      promotion:                              # one image at a time: the service
        prTitle: ^promote storefront storefront-$(service) → $(env)$
        workflow: { file: promote.yml, inputs: { app: storefront, image: ghcr.io/mierai/storefront-$(service), from: $(from), to: $(env) }, soakInput: soak }
    environments:
      - name: dev
      - { name: staging, promotion: { from: dev, soak: 5m } }
      - { name: prod, promotion: { from: staging, soak: 10m } }

  # the third storefront service: a Helm chart with values per environment (same namespaces as web / api)
  - id: storefront-worker
    title: storefront · worker
    repo: MIERAI/storefront
    push: { label: 提交 }
    release:
      name: release-worker
      jobs: { test: test, "image / build": 镜像, "promote / promote": 推送 dev }
    defaults:
      environment:
        manifests: { repo: MIERAI/gitops-manifests, path: storefront-worker/values-$(env).yaml, image: ghcr.io/mierai/storefront-worker }   # helm: {repository, tag}
        argocd: { app: storefront-worker-$(env) }
        workload: { namespace: storefront-$(env), kind: Deployment, name: worker, container: worker }
      promotion:
        prTitle: ^promote storefront-worker → $(env)$
        workflow: { file: promote.yml, inputs: { app: storefront-worker, from: $(from), to: $(env) }, soakInput: soak }
    environments:
      - name: dev
      - { name: staging, promotion: { from: dev, soak: 5m } }
      - { name: prod, promotion: { from: staging, soak: 10m } }
