apiVersion: apps/v1
kind: Deployment
metadata: { name: delivery-board, namespace: delivery-board }
spec:
  replicas: 1
  selector: { matchLabels: { app: delivery-board } }
  template:
    metadata: { labels: { app: delivery-board } }
    spec:
      serviceAccountName: delivery-board
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: board
          image: python:3.13.17-alpine3.24
          command: [python3, -I, -B, /app/board.py, "8080"]
          env:
            - { name: INTERVAL, value: "30" }
            - name: GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: delivery-board-github, key: token } }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: app, mountPath: /app, readOnly: true }]
      volumes: [{ name: app, configMap: { name: delivery-board } }]
---
apiVersion: v1
kind: Service
metadata: { name: delivery-board, namespace: delivery-board, labels: { app: delivery-board } }
spec:
  type: NodePort
  selector: { app: delivery-board }
  ports: [{ name: http, port: 8080, targetPort: http, nodePort: 30090 }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: delivery-board, namespace: delivery-board }
spec:
  selector: { matchLabels: { app: delivery-board } }
  endpoints: [{ port: http, path: /metrics, interval: 60s }]
