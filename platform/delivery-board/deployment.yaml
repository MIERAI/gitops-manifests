apiVersion: apps/v1
kind: Deployment
metadata: { name: delivery-board, namespace: delivery-board }
spec:
  replicas: 1
  selector: { matchLabels: { app: delivery-board } }
  template:
    metadata: { labels: { app: delivery-board } }
    spec:
      serviceAccountName: delivery-board
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: board
          image: ghcr.io/mierai/delivery-board:df39a57   # MIERAI/delivery-board (commit)
          args: [-config, /etc/delivery-board/config.yaml, -addr, ":8080"]
          env:
            - name: GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: delivery-board-github, key: token } }
            - name: DEV_TOKEN     # "try it": the delivered APIs' cases called live on dev (read API, dev only)
              valueFrom: { secretKeyRef: { name: delivery-board-github, key: dev_token } }
            - name: PROMOTE_TOKEN # optional (empty: the Promote button links to the workflow instead of starting it)
              valueFrom: { secretKeyRef: { name: delivery-board-github, key: promote_token, optional: true } }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: config, mountPath: /etc/delivery-board, readOnly: true }]
      volumes: [{ name: config, configMap: { name: delivery-board } }]
---
apiVersion: v1
kind: Service
metadata: { name: delivery-board, namespace: delivery-board, labels: { app: delivery-board } }
spec:
  type: NodePort
  selector: { app: delivery-board }
  ports: [{ name: http, port: 8080, targetPort: http, nodePort: 30090 }]
