# Delivery board (MIERAI/delivery-board): every change of every application (configured, or discovered from
# */app.yaml), from PR to prod, plus the promotion gates, on one page (laptop cluster only). Pipelines: config.yaml.
# http://<laptop>:30090 (Tailscale). Secret delivery-board-github (read-only GitHub token): infrastructure-live tofu,
# namespace delivery-board created there too. RBAC: read-only, cluster-wide (rbac.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [deployment.yaml, rbac.yaml]
configMapGenerator:
  - name: delivery-board
    namespace: delivery-board
    files: [config.yaml]
