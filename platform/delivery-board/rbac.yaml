apiVersion: v1
kind: ServiceAccount
metadata: { name: delivery-board, namespace: delivery-board }
---
# Read-only, cluster-wide: the running version of any workload and the state of any Argo CD Application, so an
# application registered by an app.yaml needs no RBAC change here. Nothing else (no Secrets, no Pods, no writes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: delivery-board-read }
rules:
  - { apiGroups: [apps], resources: [deployments, statefulsets], verbs: [get] }
  - { apiGroups: [argoproj.io], resources: [rollouts, applications], verbs: [get] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: delivery-board-read }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: delivery-board-read }
subjects: [{ kind: ServiceAccount, name: delivery-board, namespace: delivery-board }]
