# The laptop's users, from outside (lab cluster only: clusters/lab). The prod environments of storefront and
# sample-app get their traffic from here, over the network a user would take (Tailscale → the laptop's NodePorts):
# a real day (the night is the real night), not the compressed day the in-cluster traffic uses. And the prober the
# laptop's external probe SLOs use (platform/slo/external): blackbox on xiaoxin, reachable at :30115.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [users, blackbox-nodeport.yaml]
