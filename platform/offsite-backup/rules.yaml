apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: offsite-backup }
spec:
  groups:
    - name: platform.offsite-backup
      rules:
        - alert: OffsiteBackupStale
          # hourly job: 3 missed runs (phone off / out of the tailnet, sftp or crypt failure)
          expr: time() - kube_cronjob_status_last_successful_time{namespace="backup-offsite", cronjob="offsite-backup"} > 3 * 3600
          for: 10m
          labels: { severity: ticket }
          annotations:
            summary: "off-site backup (phone) has not succeeded for 3 hours"
            runbook: https://github.com/MIERAI/gitops-platform-blueprint/blob/main/docs/runbook.md#off-site-backup
