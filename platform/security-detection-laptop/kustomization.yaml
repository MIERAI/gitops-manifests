# Detection on the laptop (platform/security-detection): Falco's rules + backstop alerts, node-logs with cluster=laptop.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../security-detection]
configMapGenerator:          # the laptop's own Falco list additions (mounted next to the product's rules)
  - name: falco-rules-instance
    namespace: security-detection
    files: [zz-instance.rules.yaml]
    options: { disableNameSuffixHash: true }
patches:
  - target: { kind: DaemonSet, name: node-logs }
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: CLUSTER
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: laptop
