apiVersion: v1
kind: ServiceAccount
metadata: { name: alloy }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: log-shipping-alloy }
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: log-shipping-alloy }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: log-shipping-alloy }
subjects: [{ kind: ServiceAccount, name: alloy, namespace: log-shipping }]
