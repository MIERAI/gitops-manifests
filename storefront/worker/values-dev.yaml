# dev: image.tag is set by the worker's release workflow (MIERAI/storefront release-worker)
image:
  repository: ghcr.io/mierai/storefront-worker
  tag: "aff0c9f"
# traces (MIERAI/storefront#7): OTLP/HTTP to Tempo on the phone; exported in the background, dropped when unreachable
extraEnv:
  - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://100.80.225.15:14318" }   # the phone's auth proxy (ENVIRONMENTS.md 4.11)
  - { name: PHONE_TRACES_TOKEN, valueFrom: { secretKeyRef: { name: phone-auth-traces, key: token, optional: true } } }
  - { name: OTEL_EXPORTER_OTLP_HEADERS, value: "Authorization=Bearer%20$(PHONE_TRACES_TOKEN)" }
  - { name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment.name=dev,k8s.namespace.name=storefront-dev" }
