apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: storefront, app: worker }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app.kubernetes.io/part-of: storefront, app: worker } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ required "image.tag (values-<env>.yaml)" .Values.image.tag }}"
          ports: [{ containerPort: 8080, name: http }, { containerPort: 9090, name: metrics }]   # metrics: PodMonitor storefront
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.database.secret }}, key: uri } }
            - { name: WORK_TIME, value: {{ .Values.workTime | quote }} }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
