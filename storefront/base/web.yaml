apiVersion: apps/v1
kind: Deployment
metadata: { name: web }
spec:
  replicas: 2   # a pod lost (node drain, crash) must not be an outage: tested by experiments/pod-kill
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: ghcr.io/mierai/storefront-web
          env:
            - { name: API_URL, value: "http://api:8080" }
            - name: DATABASE_URL   # orders (postgres.yaml); generated by the operator
              valueFrom: { secretKeyRef: { name: postgres-app, key: uri } }
          ports: [{ containerPort: 8080, name: http }, { containerPort: 9090, name: metrics }]
          # Probe timeouts tolerate slowness (experiment api-slow-v3): with the default 1s, a 600ms network delay killed every
          # api pod (liveness) and took it out of the Service (readiness) — slowness became an outage. Liveness only detects a
          # stuck process: 5s x 6 (2 min) before a restart.
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6 }
          # 100m request = its share when the node is busy (the kernel divides contended 100m by requests). At 5m a
          # neighbour burst (Argo CD, k3s, Prometheus) starved it: the capacity test (2026-11-22, lab) broke web-latency
          # at 640 req/s with the node 75% busy, web far below a core. Sized from that run: web ~0.11 cores/pod at
          # 320 req/s, api about half. No 100m limit: bursts may use idle 100m. Memory is the cliff, not 100m (64Mi:
          # OOMKilled at 1280 req/s) - see the capacity report.
          resources:
            requests: { cpu: 100m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
  selector: { app: web }
  ports: [{ name: http, port: 8080, targetPort: http }]
