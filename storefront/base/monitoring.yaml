# Scrape web and api (:9090, storefront internal/obs). The SLOs are declared in storefront/app.yaml; label app tells
# the services apart.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: storefront
spec:
  selector: { matchExpressions: [{ key: app, operator: In, values: [web, api] }] }
  podTargetLabels: [app]
  podMetricsEndpoints:
    - { port: metrics, path: /metrics, interval: 15s }
