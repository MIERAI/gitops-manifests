# storefront (MIERAI/storefront): a monorepo, services released and promoted on their own: web (the page, takes
# orders) → api (products). Orders go to Postgres (postgres.yaml); the worker (Helm chart, ../worker) processes them.
# One overlay per environment holds both images; promotions move one image at a time (promote.yml image).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: { app.kubernetes.io/part-of: storefront }
resources: [web.yaml, api.yaml, postgres.yaml, monitoring.yaml]
