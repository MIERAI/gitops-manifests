# staging: the images are set by promotions
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storefront-staging
resources: [../../base]
patches:
  # storefront v2 step S1: staging browses through catalog (application catalog, namespace catalog-staging; its
  # NetworkPolicy admits web of storefront-staging). Rollback = revert this patch: web goes back to v1's api.
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: CATALOG_URL, value: "http://catalog.catalog-staging.svc:8080" }
  # traces: web → OTLP/HTTP to Tempo on the phone (~/workspace/gitops/ENVIRONMENTS.md §4.6), as dev (MIERAI/storefront#7).
  # 10% of new traces, parent-based (same as catalog/base/tracing.yaml): web is the root and catalog follows web's
  # decision, so a sampled page view is kept whole (web → catalog). Export is in the background (batch queue, dropped
  # when full): the phone being down never slows a request. Web only (v1's api is not on the browse path).
  # Rollback = revert this patch.
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://100.80.225.15:14318" }
      # the phone's auth proxy (ENVIRONMENTS.md 4.11): Bearer token from secret phone-auth-traces (infrastructure-live
      # tofu; optional: missing = spans refused, web runs), expanded into the header defined after it
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: PHONE_TRACES_TOKEN, valueFrom: { secretKeyRef: { name: phone-auth-traces, key: token, optional: true } } }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OTEL_EXPORTER_OTLP_HEADERS, value: "Authorization=Bearer%20$(PHONE_TRACES_TOKEN)" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OTEL_TRACES_SAMPLER, value: parentbased_traceidratio }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OTEL_TRACES_SAMPLER_ARG, value: "0.1" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment.name=staging,k8s.namespace.name=storefront-staging" }
images:
  - name: ghcr.io/mierai/storefront-web
    newTag: "ccab018"
  - name: ghcr.io/mierai/storefront-api
    newTag: "b9e57e4"
