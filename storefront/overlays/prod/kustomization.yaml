# prod: the images are set by promotions
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storefront-prod
resources: [../../base]
# reachable from outside the cluster: the external users (platform/external-users, on xiaoxin) and the phone's watcher
patches:
  - target: { kind: Service, name: web }
    patch: |-
      - { op: add, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30084 }
  # storefront v2 step S1: prod browses through catalog (application catalog, namespace catalog-prod; its
  # NetworkPolicy admits web of storefront-prod). Rollback = revert this patch: web goes back to v1's api.
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: CATALOG_URL, value: "http://catalog.catalog-prod.svc:8080" }
images:
  - name: ghcr.io/mierai/storefront-web
    newTag: "ccab018"
  - name: ghcr.io/mierai/storefront-api
    newTag: "b9e57e4"
