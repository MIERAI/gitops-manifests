# dev: each service's release workflow sets its own image (MIERAI/storefront release-web / release-api)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storefront-dev
resources: [../../base]
patches:
  # storefront v2 step S1: dev browses through catalog (application catalog, namespace catalog-dev; its NetworkPolicy
  # admits web of storefront-dev). staging / prod keep v1's api until S1 is promoted (web without CATALOG_URL).
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: CATALOG_URL, value: "http://catalog.catalog-dev.svc:8080" }
images:
  - name: ghcr.io/mierai/storefront-web
    newTag: "ccab018"
  - name: ghcr.io/mierai/storefront-api
    newTag: "aff0c9f"
