# dev: each service's release workflow sets its own image (MIERAI/storefront release-web / release-api)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storefront-dev
resources: [../../base]
patches:
  # storefront v2 step S1: dev browses through catalog (application catalog, namespace catalog-dev; its NetworkPolicy
  # admits web of storefront-dev). staging / prod keep v1's api until S1 is promoted (web without CATALOG_URL).
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: CATALOG_URL, value: "http://catalog.catalog-dev.svc:8080" }
  # traces (MIERAI/storefront#7): OTLP/HTTP to Tempo on the phone (platform.yaml clusters.laptop.components.tracing).
  # Export is in the background (batch queue, dropped when full): the phone being down never slows a request.
  # dev only; staging / prod get it through the normal promotion later.
  - target: { kind: Deployment, name: "(web|api)" }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://100.80.225.15:4318" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: OTEL_RESOURCE_ATTRIBUTES, value: "deployment.environment.name=dev,k8s.namespace.name=storefront-dev" }
images:
  - name: ghcr.io/mierai/storefront-web
    newTag: "ccab018"
  - name: ghcr.io/mierai/storefront-api
    newTag: "aff0c9f"
