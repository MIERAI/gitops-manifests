# 升级: dev 正在用的版本 → prod。开 PR,人批准后合并 → Argo CD 同步 prod
name: promote
on:
  workflow_dispatch:
    inputs:
      app:
        description: 应用
        type: choice
        options: [api-factory, sample-app]
      from: { description: 从, default: dev }
      to: { description: 到, default: prod }
permissions:
  contents: write
  pull-requests: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: 更新 tag
        id: tags
        run: echo "tags=$(scripts/promote.sh '${{ inputs.app }}' '${{ inputs.from }}' '${{ inputs.to }}')" >> "$GITHUB_OUTPUT"
      - name: 校验(用 GITHUB_TOKEN 开的 PR 不会触发 validate,这里先跑)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          scripts/validate.sh
      - name: 开 PR
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if git diff --quiet; then echo "已经是同一个版本"; exit 0; fi
          branch="promote/${{ inputs.app }}-${{ inputs.to }}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"; git commit -am "promote ${{ inputs.app }} ${{ inputs.from }} → ${{ inputs.to }}: ${{ steps.tags.outputs.tags }}"
          git push origin "$branch"
          { echo "Promote the version running in ${{ inputs.from }} to ${{ inputs.to }}: \`${{ steps.tags.outputs.tags }}\`. Merging lets Argo CD sync ${{ inputs.to }}."; echo; scripts/diff.sh origin/main; } > body.md
          gh pr create --base main --head "$branch" --title "promote ${{ inputs.app }} → ${{ inputs.to }}" --body-file body.md
