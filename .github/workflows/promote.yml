# 升级: dev 跑过的一个版本(默认: dev 现在的版本)→ prod。开 PR,人批准后合并 → Argo CD 同步 prod
# 门槛(scripts/promote.sh,从 git 历史推算): 只接受在 dev 跑过的版本,且在 dev 连续运行 ≥ soak 分钟。回滚 = 选一个旧版本。
# 交付看板(delivery-board)上的 Promote 按钮也是运行这个 workflow(另外还检查 dev 现在健康)
name: promote
on:
  workflow_dispatch:
    inputs:
      app:
        description: 应用
        type: choice
        options: [api-factory, sample-app]
      from: { description: 从, default: dev }
      to: { description: 到, default: prod }
      version: { description: "版本(tag;空 = 从的环境现在的版本;回滚时填旧版本)", default: "" }
      soak: { description: 在从的环境至少运行多少分钟, default: "10" }
permissions:
  contents: write
  pull-requests: write
  statuses: write   # report the validation of the promoted commit (PRs opened by GITHUB_TOKEN do not trigger the validate workflow)
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: 更新 tag
        id: tags
        env: { APP: "${{ inputs.app }}", FROM: "${{ inputs.from }}", TO: "${{ inputs.to }}", VERSION: "${{ inputs.version }}", SOAK: "${{ inputs.soak }}" }
        run: |   # assign first: a failed gate must fail the step (echo "$(…)" would hide the exit status)
          tags=$(scripts/promote.sh "$APP" "$FROM" "$TO" "$VERSION" "$SOAK")
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: 校验(用 GITHUB_TOKEN 开的 PR 不会触发 validate,这里先跑)
        run: |
          sudo scripts/install-tools.sh
          scripts/validate.sh
      - name: 开 PR
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if git diff --quiet; then echo "已经是同一个版本"; exit 0; fi
          branch="promote/${{ inputs.app }}-${{ inputs.to }}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"; git commit -am "promote ${{ inputs.app }} ${{ inputs.from }} → ${{ inputs.to }}: ${{ steps.tags.outputs.tags }}"
          git push origin "$branch"
          { echo "Promote the version running in ${{ inputs.from }} to ${{ inputs.to }}: \`${{ steps.tags.outputs.tags }}\`. Merging lets Argo CD sync ${{ inputs.to }}."; echo; scripts/diff.sh origin/main; } > body.md
          # the validation above ran on exactly this commit: report it as the required "validate" check
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" -f state=success -f context=validate \
            -f description="scripts/validate.sh passed in the promote workflow" >/dev/null
          url=$(gh pr create --base main --head "$branch" --title "promote ${{ inputs.app }} → ${{ inputs.to }}" --body-file body.md)
          echo "$url"
