# 每个 overlay 都能构建,通过 Kubernetes 的 schema 校验和准入策略(Kyverno)
name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tools (kubeconform, kyverno CLI)
        run: sudo scripts/install-tools.sh
      - run: scripts/validate.sh
