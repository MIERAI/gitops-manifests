# PR: 渲染后的清单的差分贴到 PR(审查的人看到的是"集群里会变成什么",不只是 kustomization 的改动)
name: diff
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: 差分
        run: |
          sudo scripts/install-tools.sh
          scripts/diff.sh "origin/${{ github.base_ref }}" > diff.md
      - name: 贴到 PR(更新上一次的评论)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --body-file diff.md || gh pr comment ${{ github.event.pull_request.number }} --body-file diff.md
