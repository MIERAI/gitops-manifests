# storefront's worker: a Helm chart (storefront-worker/chart) with values per environment, next to the kustomize
# services of the same namespace (storefront-dev)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storefront-worker-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MIERAI/gitops-manifests.git
    targetRevision: main
    path: storefront-worker/chart
    helm:
      releaseName: storefront-worker
      valueFiles: [../values-dev.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: storefront-dev
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    managedNamespaceMetadata:   # admission policies apply to namespaces with this label (platform/policies)
      labels: { gitops-platform/policies: enforced }
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
