# prod: promote workflow 开 PR(dev 的版本 → prod),人批准后合并
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: api-factory-prod
resources: [../../base]
components: [../../components/restore-check]   # daily: the backups really restore
replicas:
  - name: api-factory
    count: 2
patches:
  # backups of each environment under their own prefix in the bucket
  - target: { kind: ObjectStore, name: backups }
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        # -v2: the cluster was re-created with a larger disk (2026-11-18); a new cluster must not archive into the
        # old one's WAL ("Expected empty archive"). The old prefix is kept until its backups expire.
        value: s3://cnpg/api-factory-prod-v2
  - target: { kind: Cluster, name: postgres }
    patch: |-
      - op: replace
        path: /spec/instances
        value: 2
      # production-like volume (factory seed-volume: 3 databases x 11 tables x 1M rows ≈ 5 GB + WAL while loading).
      # local-path cannot expand a volume: changing the size means re-creating the cluster (from a backup).
      - op: replace
        path: /spec/storage/size
        value: 20Gi
      # sized for the production-like volume (≈5 GB, 3 databases): with 512Mi the first load test OOM-killed the
      # primary (16 concurrent requests, ~70 backends from the API pools + parallel workers). Pools are capped too
      # (pool_max_conns=8 per database and pod, infrastructure-live tofu).
      - op: replace
        path: /spec/resources
        value: { requests: { cpu: 500m, memory: 1Gi }, limits: { memory: 2Gi } }
      - op: add
        path: /spec/postgresql
        value:
          parameters: { shared_buffers: 512MB, effective_cache_size: 1536MB, work_mem: 8MB, max_parallel_workers_per_gather: "1" }
  - target: { kind: Service, name: api-factory }
    patch: |-
      - op: replace
        path: /spec/ports/0/nodePort
        value: 30081
images:
  - name: ghcr.io/mierai/api-factory
    newTag: "e30907e"
  - name: ghcr.io/mierai/api-factory-schema
    newTag: "e30907e"
