# dev: 应用仓库的 CI 合并到 main 时自动更新 images(newTag = 提交)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: api-factory-dev
resources: [../../base, load-test.yaml, rehearsal-rbac.yaml]
patches:
  # backups of each environment under their own prefix in the bucket
  - target: { kind: ObjectStore, name: backups }
    patch: |-
      - op: replace
        path: /spec/configuration/destinationPath
        value: s3://cnpg/api-factory-dev
  # dev だけ: 迁移のあとにデモデータ(api-factory の db/seed)を入れる(init container)
  - target: { kind: Deployment, name: api-factory }
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/env/-
        value: { name: SEED, value: demo }
images:
  - name: ghcr.io/mierai/api-factory
    newTag: "271aac3"
  - name: ghcr.io/mierai/api-factory-schema
    newTag: "271aac3"
