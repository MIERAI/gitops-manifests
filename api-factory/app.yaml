# api-factory: registered here (format and what follows from it: storefront/app.yaml). Private repository: images
# not signed (signing would publish its name in the public transparency log). Its runtime secrets (database, API
# token, backups) are written by OpenTofu (infrastructure-live), which therefore still creates its namespaces.
# The delivery board configures this pipeline itself (design PRs, "try it"): its config entry wins over discovery.
name: api-factory
repo: MIERAI/api-factory
signedImages: false
private: true                    # its images are private: left out of the demo cluster (clusters/demo)
environments:
  - { name: dev, url: "http://100.90.245.89:30080" }
  - name: prod
    url: http://100.90.245.89:30081
    promotion: { from: dev, soak: 10m }
components:
  - { name: api-factory, kustomize: overlays }   # overlays/<env>: the API + its migration image (moved together)
services:
  - { name: api, image: ghcr.io/mierai/api-factory, component: api-factory, workload: { name: api-factory, container: api } }
# SLOs (gitops-platform-blueprint docs/slo.md): rendered per environment into Pyrra objectives and burn-rate alerts.
# One SLO over every RPC, not one per procedure: they are one shape (generated read-only queries), one process and one
# database, so they fail together; the dashboard splits by procedure. A broken procedure with little traffic can stay
# under the burn thresholds: that is the price of not having ~40 SLOs that each see a handful of requests.
slos:
  - name: rpc-availability
    description: An RPC answered without a server error (internal / unavailable / unknown / deadline_exceeded /
      data_loss), as counted by the API itself. Client errors (invalid_argument, not_found, unauthenticated...) and
      canceled (the caller gave up; a slow answer burns rpc-latency instead) are not bad events. Counts the synthetic
      traffic and dev's post-deploy load test. Blind to requests that never reach a pod (no pod running, a broken
      Service); health-probe sees those. The readiness probe does not ping the database, so a database outage reaches
      the pods and is counted here.
    objective: 99.9
    availability: { metric: rpc_requests_total, errors: 'code=~"internal|unavailable|unknown|deadline_exceeded|data_loss"' }
  - name: rpc-latency
    description: An RPC answered within 100ms (a bucket edge of the API's histogram), whatever its result code. The
      factory's perf gate allows 50ms of database time per query; normally p99 is under 10ms. Same blind spot as
      rpc-availability.
    objective: 99
    latency: { metric: rpc_request_duration_seconds, threshold: "0.1" }
  - name: rpc-latency-severe
    description: >-
      An RPC answered within 1s (a bucket edge). The second latency threshold, for slowness that is as bad as
      an outage to a caller (clients give up at 3s): it burns fast and pages within minutes, while rpc-latency (100ms)
      catches milder slowness slowly (2026-11-20, +200ms on the database paged rpc-latency after 15 min — by
      design, ≈4% of its budget). Same blind spot as rpc-availability.
    objective: 99.9
    latency: { metric: rpc_request_duration_seconds, threshold: "1" }
  - name: health-probe
    description: /healthz (process up and the database answering a ping within 1s) answered 2xx through the Service,
      from outside the pods (blackbox prober, every 15s). Sees what the in-pod SLIs cannot (no ready pod, a broken
      Service), but not an RPC itself (it is unauthenticated and runs no query), and only at probe granularity.
    objective: 99.5
    probe: { service: api-factory, port: 8080, path: /healthz }
  # Scheduled-job SLOs of its database (gitops-platform-blueprint docs/slo.md §1 "scheduled job"): what someone who
  # has to restore would get. Time-based: the share of 30s evaluations at which the safety net is in place.
  - name: recovery-point
    description: >-
      Every write reaches the object store (WAL archiving): bad while a WAL segment of the primary has
      waited for archiving 10 minutes on end (platform/pyrra/slis.yaml). An idle database is good (no WAL, nothing at
      risk). Pages: the recovery point falls further behind every minute and pg_wal grows until the disk is full.
      Blind to WAL not yet switched into a segment (≤ archive_timeout, 5 min).
    objective: 99.5
    runbook: database-backups
    bool: { metric: "cnpg:wal_archive_keeps_up:bool" }
  - name: base-backup
    description: >-
      A base backup (daily, 03:00 JST) at most 26 hours old in the object store. A ticket, never a page —
      while WAL archiving works the recovery point is intact; an old base backup only makes a restore replay more WAL.
    objective: 95                # one missed night ≈ a day of a 33.6 h budget; two in 28 days spend it
    runbook: database-backups
    severities: { fastBurn: ticket, mediumBurn: ticket }
    age: { metric: barman_cloud_cloudnative_pg_io_last_available_backup_timestamp, max: 26h }
  - name: restore-check
    description: >-
      The nightly restore check (04:30 JST) succeeded within the last 26 hours. A ticket — the live data
      is fine, what is in doubt is whether it could be restored.
    objective: 95
    environments: [prod]         # the CronJob runs in prod only (components/restore-check)
    runbook: daily-restore-check
    severities: { fastBurn: ticket, mediumBurn: ticket }
    age: { metric: kube_cronjob_status_last_successful_time, matchers: 'cronjob="restore-check"', max: 26h }
