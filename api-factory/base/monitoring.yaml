# Metrics and a dashboard for api-factory. The SLOs and their burn-rate alerts are declared in api-factory/app.yaml
# (rendered by the platform into Pyrra objectives); what counts as a server error is written there.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: api-factory
spec:
  selector: { matchLabels: { app: api-factory } }
  podMetricsEndpoints:
    - { port: metrics, path: /metrics, interval: 10s }   # internal port, no auth (METRICS_PORT)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-factory-dashboard
  labels: { grafana_dashboard: "1" }
data:
  api-factory.json: |
    {
      "title": "api-factory", "uid": "api-factory", "schemaVersion": 39, "refresh": "10s", "time": { "from": "now-30m", "to": "now" },
      "templating": { "list": [ { "name": "namespace", "type": "query", "datasource": "Prometheus",
        "query": "label_values(rpc_requests_total, namespace)", "refresh": 2 } ] },
      "panels": [
        { "type": "timeseries", "title": "RPC / s by procedure", "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum by (procedure) (rate(rpc_requests_total{namespace=\"$namespace\"}[1m]))", "legendFormat": "{{procedure}}" } ] },
        { "type": "timeseries", "title": "RPC / s by code", "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum by (code) (rate(rpc_requests_total{namespace=\"$namespace\"}[1m]))", "legendFormat": "{{code}}" } ] },
        { "type": "timeseries", "title": "p95 latency by procedure (s)", "gridPos": { "x": 0, "y": 8, "w": 24, "h": 8 },
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (procedure, le) (rate(rpc_request_duration_seconds_bucket{namespace=\"$namespace\"}[1m])))", "legendFormat": "{{procedure}}" } ] }
      ]
    }
