# Synthetic traffic (2 RPC/s, open loop, over a few APIs, with the API token): feeds the metrics and the alerts on a cluster without users.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-traffic
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  replicas: 1
  selector: { matchLabels: { app: synthetic-traffic } }
  template:
    metadata: { labels: { app: synthetic-traffic } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 100, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: curl
          image: curlimages/curl:8.23.0
          env:
            - name: TOKEN
              valueFrom: { secretKeyRef: { name: api-token, key: token } }   # created by infrastructure-live tofu/modules/platform (values: secrets/*.sops.yaml)
          command: ["sh", "-c"]
          args:
            - |
              call() { curl -s -o /dev/null --max-time 3 -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" -d "$2" "http://api-factory:8080/$1"; }
              # open loop: one call every 0.5s, started whether or not the previous ones answered (users do not wait
              # for each other). Closed loop (call, wait, call) sends less when the API slows down and hides it: a
              # +200ms database took 15 min to page instead of ~10. --max-time 3 bounds the calls in flight.
              set -- 'factory.jobs.v1.JobService/ListJobs {"pageSize":3}' \
                'factory.sales.v1.SaleService/ListEffectivePriceChanges {"storeCode":1,"procDate":"2026-11-20"}' \
                'factory.sales.v1.SaleService/ListCurrentPrices {"storeCode":1,"asOf":"2026-11-20"}' \
                'factory.catalog.v1.CatalogService/GetProductLabel {"productCode":"100","labelCode":"A"}'
              while true; do
                for c in "$@"; do
                  call "${c%% *}" "${c#* }" &
                  sleep 0.5
                done
              done   # no wait: it would pause the loop behind a slow call (ash reaps finished background jobs itself)
          # 64Mi: at 32Mi it was OOMKilled ~once a day (dev and prod, 3 each in 3 days), when the API was slow or
          # rolling and the open loop piled up curl processes (--max-time 3, a new one every 0.5s). Steady ~5-10Mi.
          resources:
            requests: { cpu: 5m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
