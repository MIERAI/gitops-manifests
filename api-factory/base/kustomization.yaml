# api-factory(查询工厂生成的 API)。顺序(sync wave): Postgres(CloudNativePG + 备份)→ 建表 Job → API → 部署后的检查
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: { app.kubernetes.io/part-of: api-factory }
resources:
  - postgres.yaml
  - pdb.yaml
  - deployment.yaml
  - service.yaml
  - smoke-job.yaml
  - monitoring.yaml
  - traffic.yaml
images:
  - name: ghcr.io/mierai/api-factory
  - name: ghcr.io/mierai/api-factory-schema
patches:
  - path: tracing.yaml   # OTEL_* of the server (container 0; the migrate init container needs none)
    target: { kind: Deployment, name: api-factory }
