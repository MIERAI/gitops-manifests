apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-factory
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  replicas: 1
  selector: { matchLabels: { app: api-factory } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # 新版本健康之前旧版本继续服务
  template:
    metadata: { labels: { app: api-factory } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }   # distroless 的 nonroot
      # Schema migrations (goose, image built with the API in the same release) before every start: a new version
      # migrates before it serves, and a re-created database gets its tables without a deploy. Concurrent pods: a
      # Postgres advisory lock runs each migration once. Migrations must stay compatible with the running version
      # (expand / contract): during a rolling update the old pods keep serving on the new schema.
      initContainers:
        - name: migrate
          image: ghcr.io/mierai/api-factory-schema
          env:
            - { name: PGHOST, value: postgres-rw }   # CloudNativePG primary service
            - { name: PGUSER, value: factory }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-app, key: password } }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: api
          image: ghcr.io/mierai/api-factory
          ports: [{ containerPort: 8080, name: http }, { containerPort: 9091, name: metrics }]
          env:
            - { name: AUTH_MODE, value: token }
            - { name: METRICS_PORT, value: "9091" }   # metrics without auth, not exposed by the Service
          envFrom:
            - secretRef: { name: api-factory }   # DATABASE_URL / FACTORY_SHARDS / PAGE_TOKEN_KEY / AUTH_TOKEN_SHA256
          # Neither probe touches the database (api-factory /livez, /readyz): with the database down, restarting the API
          # or taking every pod out of the Service fixes nothing — users got connection refused and the in-pod SLIs
          # counted nothing (experiment api-factory-db-partition). /healthz (database ping) is for the external probe.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
