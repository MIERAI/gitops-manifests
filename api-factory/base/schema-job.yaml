# 建表(幂等): API 的镜像同一次构建出来的 api-factory-schema(表结构 = 应用仓库的 db/schema)。每次同步都执行
apiVersion: batch/v1
kind: Job
metadata:
  name: schema
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300   # 拉不到镜像等情况: 5 分钟后失败(不然同步会一直等这个钩子)
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }   # image USER 65532
      containers:
        - name: schema
          image: ghcr.io/mierai/api-factory-schema
          env:
            - { name: PGHOST, value: postgres-rw }   # CloudNativePG primary service
            - { name: PGUSER, value: factory }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-app, key: password } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
