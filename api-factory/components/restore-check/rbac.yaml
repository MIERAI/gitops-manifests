apiVersion: v1
kind: ServiceAccount
metadata: { name: restore-check }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: restore-check }
rules:
  - { apiGroups: [postgresql.cnpg.io], resources: [clusters], verbs: [get, list, watch, create, patch, delete] }
  - { apiGroups: [postgresql.cnpg.io], resources: [backups], verbs: [get, list] }
  - { apiGroups: [""], resources: [pods], verbs: [get, list] }
  - { apiGroups: [""], resources: [pods/exec], verbs: [create] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: restore-check }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: restore-check }
subjects: [{ kind: ServiceAccount, name: restore-check }]
