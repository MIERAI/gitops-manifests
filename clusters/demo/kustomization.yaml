# The demo cluster (infrastructure-live tofu/demo): what anyone can run locally, without our keys or tokens — the
# platform and every public application. Applications marked private: true in their app.yaml (private images, e.g.
# api-factory) are left out: the ApplicationSet gets a post-selector.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps
patches:
  - target: { kind: ApplicationSet, name: applications }
    patch: |-
      - op: add
        path: /spec/generators/0/selector
        value:
          matchExpressions:
            - { key: private, operator: NotIn, values: ["true"] }
  - target: { kind: Application, name: platform-experiments }   # no api-factory namespaces to bind the runner to
    patch: |-
      - { op: replace, path: /spec/source/path, value: platform/experiments-demo }
