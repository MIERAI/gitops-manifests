# The laptop cluster (k3s on a Linux laptop, always on): every Application of apps/, plus
# - object storage outside the cluster (host SeaweedFS on its own disk): backups survive a cluster rebuild
# - hourly encrypted off-site copy of the backups to the phone (platform/offsite-backup), and its SLO
# - delivery board: every change of every application, from PR to prod, and the promotion gates (platform/delivery-board, :30090)
# - the UIs on NodePorts (platform/ui-laptop): Argo CD :30085, Grafana :30086 (also the lab's and the phone's Prometheus),
#   Prometheus :30087, Alertmanager :30088, Pyrra :30089
# - Alertmanager routes our prod alerts (severity page / ticket) to the laptop's speakers; the chart's default rules
#   (severity critical / warning / info) go nowhere: several false-positive on k3s, where the control plane runs
#   inside one process
# - prod's users are outside (platform/external-users on xiaoxin): the in-cluster traffic only calls dev and staging;
#   external probe SLOs (platform/slo/external) see prod as those users do
# - Alertmanager's Watchdog (always firing) goes to the phone every minute: the phone's watcher speaks (on xiaoxin)
#   when it stops — the alerting itself is down (infrastructure-live ansible role gitops_watch)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps
  - platform-alert-speaker.yaml
  - platform-offsite-backup.yaml
  - platform-offsite-backup-slo.yaml
  - platform-delivery-board.yaml
  - platform-external-probe-storefront.yaml
  - platform-external-probe-sample-app.yaml
  - platform-ui.yaml               # Argo CD, Grafana, Prometheus, Alertmanager, Pyrra on NodePorts 30085-30089
patches:
  - target: { kind: Application, name: platform-traffic }
    patch: |-
      - op: add
        path: /spec/source/kustomize
        value:
          patches:
            - target: { kind: Deployment, name: k6 }
              patch: |-
                apiVersion: apps/v1
                kind: Deployment
                metadata: { name: k6 }
                spec:
                  template:
                    spec:
                      containers:
                        - name: k6
                          env: [{ name: ENVS, value: "staging:0.3,dev:0.3" }, { name: SAMPLE_APP_ENVS, value: dev }]
  # no fault injection on the laptop, ever: the scheduled experiment regression is a lab component (kind, demo)
  - target: { kind: Application, name: platform-experiments }
    patch: |-
      $patch: delete
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata: { name: platform-experiments }
  - target: { kind: Application, name: platform-chaos-mesh }
    patch: |-
      - { op: replace, path: /spec/source/helm/valuesObject/chaosDaemon/socketPath, value: /run/k3s/containerd/containerd.sock }
  - target: { kind: Application, name: platform-object-storage }
    patch: |-
      - { op: replace, path: /spec/source/path, value: platform/object-storage-external }
  - target: { kind: Application, name: platform-monitoring }
    patch: |-
      # the one Grafana: the lab's and the phone's Prometheus too (the phone's former Grafana dashboards use
      # phone-prometheus: infrastructure-live ansible role phone_dashboards)
      - op: add
        path: /spec/source/helm/valuesObject/grafana/additionalDataSources
        value:
          - { name: "Prometheus · lab (xiaoxin)", uid: lab-prometheus, type: prometheus, access: proxy, url: "http://100.76.236.114:30087", jsonData: { timeInterval: 15s } }
          - { name: "Prometheus · phone", uid: phone-prometheus, type: prometheus, access: proxy, url: "http://100.80.225.15:9090", jsonData: { timeInterval: 15s } }
      - op: add
        path: /spec/source/helm/valuesObject/alertmanager/config
        value:
          route:
            receiver: "null"
            group_by: [alertname, namespace]   # per service, not per SLO: a database outage burns 4 SLOs, one announcement
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            routes:
              # the dead man's switch: Watchdog always fires; the phone notices when it stops arriving
              - { receiver: phone-watch, matchers: ['alertname="Watchdog"'], group_wait: 0s, group_interval: 1m, repeat_interval: 1m }
              # only prod notifies (gitops-platform-blueprint docs/slo.md §4): dev / staging alerts stay visible in
              # Alertmanager and Grafana. Their low traffic and the fault experiments run there made every short fault
              # page twice (fast burn, then the 6h window after recovery).
              - { receiver: "null", matchers: ['namespace=~".+-(dev|staging)"'] }
              - { receiver: speaker, matchers: ['severity=~"page|ticket"'] }
          # one incident, one announcement: while an SLO's fast burn (1h window) pages, its medium burn (6h) page and
          # its tickets stay quiet
          inhibit_rules:
            - source_matchers: ['alertname="ErrorBudgetBurn"', 'severity="page"', 'long="1h"']
              target_matchers: ['alertname="ErrorBudgetBurn"', 'severity="page"', 'long="6h"']
              equal: [namespace, slo]
            - source_matchers: ['alertname="ErrorBudgetBurn"', 'severity="page"']
              target_matchers: ['alertname="ErrorBudgetBurn"', 'severity="ticket"']
              equal: [namespace, slo]
          receivers:
            - name: "null"
            - name: phone-watch
              webhook_configs:
                - { url: "http://100.80.225.15:9195/watchdog", send_resolved: false }
            - name: speaker
              webhook_configs:
                - { url: "http://alert-speaker.alert-speaker.svc:8080/", send_resolved: true }
