# The platform's UIs on NodePorts (platform/ui-laptop): http://<this machine>:30085-30089
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MIERAI/gitops-manifests.git
    targetRevision: main
    path: platform/ui-laptop
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
