# lab only: the laptop's prod users, from outside (platform/external-users)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-external-users
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MIERAI/gitops-manifests.git
    targetRevision: main
    path: platform/external-users
  destination:
    server: https://kubernetes.default.svc
    namespace: external-users
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
