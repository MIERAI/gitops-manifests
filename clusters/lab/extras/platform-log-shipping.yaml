# Every pod's logs → Loki on the phone (platform/log-shipping). The lab first; the laptop after a soak.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-log-shipping
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MIERAI/gitops-manifests.git
    targetRevision: main
    path: platform/log-shipping-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: log-shipping
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
