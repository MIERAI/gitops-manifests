# The lab's own components (platform.yaml clusters.lab.extras): the capacity tests' identity (platform-capacity), the
# sync window during the regression (platform-sync-window), the UIs on NodePorts and the in-cluster object store (the
# backup experiments need it). The synthetic traffic (platform-traffic: storefront v1 and sample-app, paused since
# 2026-11-22) left with storefront v1 on 2026-11-23; applications bring their own with app.yaml traffic.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - platform-ui.yaml
  - platform-object-storage.yaml
  - platform-capacity.yaml
  - platform-sync-window.yaml
  - platform-log-shipping.yaml   # pod logs → Loki on the phone
