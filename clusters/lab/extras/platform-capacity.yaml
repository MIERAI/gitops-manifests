# The capacity tests' identity on the lab (platform/capacity-lab): what winpc's runner may do here — no admin.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-capacity
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MIERAI/gitops-manifests.git
    targetRevision: main
    path: platform/capacity-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: slo-experiments
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
