# The lab's applications are not synced automatically during the daily regression (platform/sync-window-lab).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-sync-window
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MIERAI/gitops-manifests.git
    targetRevision: main
    path: platform/sync-window-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
