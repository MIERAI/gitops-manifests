# catalog: storefront v2's product service (MIERAI/storefront services/catalog, generated by api-factory; design
# docs/design/v2-microservices.md §8 step S1). Format and what follows from it: storefront/app.yaml.
#
# Its own application, not a component of storefront: v2's services are deployed, promoted and owned one by one
# (design §4), and clusters choose applications (platform.yaml clusters.<name>.applications) — the lab runs v2 without
# v1. Namespaces catalog-<env>; web (storefront-<env>) calls it at http://catalog.catalog-<env>.svc:8080.
#
# Environments: dev and staging (laptop and lab: slo-platform creates every environment on both clusters). prod comes
# later (the owner's call): add it here together with overlays/prod and backup-s3 for catalog-prod
# (infrastructure-live backup_namespaces) — the steps are in the storefront design doc §14.1 (M2).
name: catalog
repo: MIERAI/storefront          # its release workflow release-catalog builds the image and sets it in dev
signedImages: true               # signed by the shared build workflow (public repository)
namespace: { labels: { gitops-platform/image-signatures: required } }   # our signature policy (Kyverno, laptop)
environments:
  - name: dev
  - name: staging
    promotion: { from: dev, soak: 5m }
components:
  - { name: catalog, kustomize: overlays }   # overlays/<env>/kustomization.yaml: Postgres + the service
services:
  - { name: catalog, image: ghcr.io/mierai/storefront-catalog, component: catalog }
# SLOs (gitops-platform-blueprint docs/slo.md). Browsing = the two read RPCs web's page needs (ListProducts; GetProduct
# for product pages). The user-facing browsing SLOs stay web's (storefront web-availability / web-latency): these
# tell whether a web symptom is catalog's fault, as api-availability / api-latency did for v1. The write RPCs
# (CreateProduct, UpdatePrice, …) are an operator's, not browsing: not in these SLOs.
slos:
  - name: browse-availability
    description: ListProducts / GetProduct answered without a server error (internal / unavailable / unknown /
      deadline_exceeded / data_loss), as counted by catalog itself (api-factory-runtime rpc_requests_total). Client
      errors (invalid_argument, not_found) and canceled are not bad events. Blind to requests that never reach a pod
      (web's upstream_requests_total{upstream="catalog"} and its degraded pages see those). A database outage reaches
      the pods (the probes do not ping it) and is counted here.
    objective: 99.9
    availability:
      metric: rpc_requests_total
      matchers: 'procedure=~"/catalog.catalog.v1.CatalogService/(ListProducts|GetProduct)"'
      errors: 'code=~"internal|unavailable|unknown|deadline_exceeded|data_loss"'
  - name: browse-latency
    description: ListProducts / GetProduct answered within 100ms (a bucket edge of the runtime's histogram), whatever
      the result. web asks once per category for every page (two calls today) inside its own 500ms page budget.
    objective: 99
    latency:
      metric: rpc_request_duration_seconds
      matchers: 'procedure=~"/catalog.catalog.v1.CatalogService/(ListProducts|GetProduct)"'
      threshold: "0.1"
