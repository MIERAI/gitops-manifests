# catalog's own database: a CloudNativePG cluster in its namespace (design §4.3: one database and one account per
# service, the account sees only its database). The operator generates the login: Secret postgres-app (key uri →
# DATABASE_URL), user and database `catalog`. Tables: the service's migrations (init container, goose).
#
# Why its own instance and not a database in storefront's cluster (design §12 "沿用现有的 CNPG 集群"): catalog lives
# in catalog-<env> and a Pod reads Secrets of its own namespace only; a role in storefront-<env>'s cluster would need its
# password copied across namespaces (no mechanism on the lab: no Kyverno, no secret operator) or written into this
# public repository. One small instance per environment (~40 MB used) keeps the ownership strict; revisit at S2 if
# memory gets tight (a shared per-environment cluster in its own namespace + a secret operator).
#
# Backups like api-factory's (the first step of the promotion, storefront design §14.1: before prod, prices edited by
# operators are data that exists nowhere else): barman-cloud plugin → ObjectStore "backups" (SeaweedFS, outside the
# cluster on the laptop), continuous WAL archiving + a daily base backup, 7 days. destinationPath per environment
# (overlays). Credentials: Secret backup-s3 in this namespace, written by OpenTofu (infrastructure-live
# tofu/modules/platform, backup_namespaces) — never in this public repository. The daily restore check
# (api-factory/components/restore-check) runs in prod only: catalog gets it together with its prod overlay.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.10
  storage: { size: 1Gi }
  smartShutdownTimeout: 10      # connection pools never disconnect by themselves (api-factory: 197s → 10s)
  postgresql:
    parameters: { shared_buffers: 32MB, max_connections: "50" }
  resources:
    requests: { cpu: 20m, memory: 96Mi }
    limits: { memory: 256Mi }
  bootstrap:
    initdb: { database: catalog, owner: catalog }
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters: { barmanObjectName: backups }
---
# Where backups go. destinationPath is per environment (overlays); a new cluster needs a new prefix ("Expected empty
# archive": the plugin refuses a prefix that holds another cluster's WAL).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backups
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  retentionPolicy: 7d
  # The plugin injects this sidecar into the Postgres Pod (WAL archiving, base backups). api-factory's peak: ~110Mi.
  instanceSidecarConfiguration:
    resources:
      requests: { cpu: 10m, memory: 128Mi }
      limits: { memory: 512Mi }
  configuration:
    destinationPath: s3://cnpg/OVERRIDDEN-BY-OVERLAY
    endpointURL: http://seaweedfs.object-storage:8333
    s3Credentials:
      accessKeyId: { name: backup-s3, key: ACCESS_KEY_ID }
      secretAccessKey: { name: backup-s3, key: ACCESS_SECRET_KEY }
    wal: { compression: gzip }
    data: { compression: gzip }
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: daily
  annotations: { argocd.argoproj.io/sync-wave: "1" }
spec:
  schedule: "0 0 18 * * *"      # 03:00 JST (seconds field first), as api-factory's
  immediate: true               # first base backup right after creation: PITR works from day one
  backupOwnerReference: self
  cluster: { name: postgres }
  method: plugin
  pluginConfiguration: { name: barman-cloud.cloudnative-pg.io }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: { name: postgres }
spec:
  selector: { matchLabels: { cnpg.io/cluster: postgres } }
  podMetricsEndpoints:
    - { port: metrics, interval: 30s }
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: postgres }
spec:
  groups:
    - name: catalog.postgres
      rules:
        # the cause of a recovery point falling behind (as api-factory's: a ticket; dev / staging notify nobody)
        - alert: PostgresWalArchivingFailing
          expr: increase(cnpg_pg_stat_archiver_failed_count[10m]) > 0
          for: 10m
          labels: { severity: ticket }
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }}: WAL archiving fails, point-in-time recovery window is not advancing"
            runbook: https://github.com/MIERAI/gitops-platform-blueprint/blob/main/docs/runbook.md#database-backups
