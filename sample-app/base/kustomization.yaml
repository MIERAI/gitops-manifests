apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: { app.kubernetes.io/part-of: sample-app }
resources: [rollout.yaml, analysis.yaml, service.yaml]
images:
  - name: ghcr.io/mierai/sample-app
# kustomize: the image/replica transformers must also know the Rollout kind
configurations: [rollout-transform.yaml]
