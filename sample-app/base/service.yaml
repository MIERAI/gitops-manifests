apiVersion: v1
kind: Service
metadata:
  name: sample-app
spec:
  type: NodePort
  selector: { app: sample-app }
  ports: [{ name: http, port: 8080, targetPort: http, nodePort: 30082 }]
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app-canary
spec:
  selector: { app: sample-app }
  ports: [{ name: http, port: 8080, targetPort: http }]
