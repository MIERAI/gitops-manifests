# Metrics, SLO alerts and a dashboard for sample-app.
# SLO: 99.5% of /hello requests succeed (error budget 0.5%) — multi-window burn-rate alerts (Google SRE workbook).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: sample-app
spec:
  selector: { matchLabels: { app: sample-app } }
  podTargetLabels: [rollouts-pod-template-hash]   # canary vs stable in the queries
  podMetricsEndpoints:
    - { port: http, path: /metrics, interval: 10s }
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sample-app
spec:
  groups:
    - name: sample-app.slo
      rules:
        - record: sample_app:hello_errors:ratio_rate5m
          expr: |
            sum by (namespace) (rate(http_requests_total{route="GET /hello",code=~"5.."}[5m]))
              / sum by (namespace) (rate(http_requests_total{route="GET /hello"}[5m]))
        - record: sample_app:hello_errors:ratio_rate1h
          expr: |
            sum by (namespace) (rate(http_requests_total{route="GET /hello",code=~"5.."}[1h]))
              / sum by (namespace) (rate(http_requests_total{route="GET /hello"}[1h]))
        - alert: SampleAppErrorBudgetFastBurn
          # 14.4x burn: 2% of a 30-day budget in 1 hour
          expr: sample_app:hello_errors:ratio_rate5m > (14.4 * 0.005) and sample_app:hello_errors:ratio_rate1h > (14.4 * 0.005)
          for: 2m
          labels: { severity: page }
          annotations:
            summary: "sample-app {{ $labels.namespace }}: /hello errors burn the error budget 14x"
            runbook: https://github.com/MIERAI/gitops-platform-blueprint/blob/main/docs/runbook.md#error-budget-burn
        - alert: SampleAppHighLatency
          expr: |
            histogram_quantile(0.95, sum by (namespace, le) (rate(http_request_duration_seconds_bucket{route="GET /hello"}[5m]))) > 0.3
          for: 5m
          labels: { severity: ticket }
          annotations:
            summary: "sample-app {{ $labels.namespace }}: p95 latency of /hello above 300ms"
            runbook: https://github.com/MIERAI/gitops-platform-blueprint/blob/main/docs/runbook.md#latency
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-dashboard
  labels: { grafana_dashboard: "1" }
data:
  sample-app.json: |
    {
      "title": "sample-app", "uid": "sample-app", "schemaVersion": 39, "refresh": "10s", "time": { "from": "now-30m", "to": "now" },
      "templating": { "list": [ { "name": "namespace", "type": "query", "datasource": "Prometheus",
        "query": "label_values(http_requests_total, namespace)", "refresh": 2 } ] },
      "panels": [
        { "type": "timeseries", "title": "Requests / s by code", "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum by (code) (rate(http_requests_total{namespace=\"$namespace\",route=\"GET /hello\"}[1m]))", "legendFormat": "{{code}}" } ] },
        { "type": "timeseries", "title": "Error ratio by version (canary vs stable)", "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [ { "expr": "sum by (rollouts_pod_template_hash) (rate(http_requests_total{namespace=\"$namespace\",route=\"GET /hello\",code=~\"5..\"}[1m])) / sum by (rollouts_pod_template_hash) (rate(http_requests_total{namespace=\"$namespace\",route=\"GET /hello\"}[1m]))", "legendFormat": "{{rollouts_pod_template_hash}}" } ] },
        { "type": "timeseries", "title": "p95 latency (s)", "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [ { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\",route=\"GET /hello\"}[1m])))", "legendFormat": "p95" } ] },
        { "type": "stat", "title": "Error ratio (1h) vs SLO budget 0.5%", "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [ { "expr": "sample_app:hello_errors:ratio_rate1h{namespace=\"$namespace\"}" } ] }
      ]
    }
