# sample-app: registered here (format and what follows from it: storefront/app.yaml). Canary releases (Argo Rollouts).
name: sample-app
repo: MIERAI/sample-app
signedImages: true
environments:
  - { name: dev, url: "http://100.90.245.89:30082" }
  - name: prod
    url: http://100.90.245.89:30083
    promotion: { from: dev, soak: 10m }
components:
  - { name: sample-app, kustomize: overlays }
services:
  - { name: sample-app, image: ghcr.io/mierai/sample-app, component: sample-app, release: ci,
      workload: { kind: Rollout, name: sample-app, container: app } }
# Argo Rollouts adds rollouts-pod-template-hash to the stable/canary Service selectors during a rollout. Without this,
# self-heal reverts it: the canary Service then also selects stable pods and the analysis can pass by hitting healthy
# stable pods (seen in the fault injection demo).
ignoreDifferences:
  - { group: "", kind: Service, jqPathExpressions: ['.spec.selector["rollouts-pod-template-hash"]'] }
# SLOs (gitops-platform-blueprint docs/slo.md): rendered per environment into Pyrra objectives and burn-rate alerts
slos:
  - name: hello-availability
    description: GET /hello answered without a server error. Counts the synthetic traffic and the canary load tests
      too; blind to requests that never reach a pod.
    objective: 99.5
    availability: { metric: http_requests_total, matchers: 'app="sample-app", route="GET /hello"', errors: 'code=~"5.."' }
  - name: hello-latency
    description: GET /hello answered within 250ms (a bucket edge of the app's histogram).
    objective: 99
    latency: { metric: http_request_duration_seconds, matchers: 'app="sample-app", route="GET /hello"', threshold: "0.25" }
