apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-app-dev
resources: [../../base]
patches:
  # Fault injection demo: the canary answers /hello with 500 → its analysis fails → the rollout aborts, stable keeps serving
  - target: { kind: Rollout, name: sample-app }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value: [{ name: FAULT_HELLO, value: "1" }]
images:
  - name: ghcr.io/mierai/sample-app
    newTag: "9388291"
