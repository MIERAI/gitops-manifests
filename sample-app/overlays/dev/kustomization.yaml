apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-app-dev
resources: [../../base]
replicas:
  - name: sample-app
    count: 2   # a canary at 50% = 1 of 2 pods
images:
  - name: ghcr.io/mierai/sample-app
    newTag: "031766f"
patches:
  # Fault injection demo: the canary answers /hello with 500 → its error ratio fails the analysis → the rollout aborts
  - target: { kind: Rollout, name: sample-app }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value: [{ name: FAULT_HELLO, value: "1" }]
