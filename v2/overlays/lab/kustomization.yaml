# lab (xiaoxin) only: platform.yaml excludes the application v2 on the laptop. The release-<name> workflows of
# MIERAI/storefront set the tags of inventory, payment, notification, order and topology; catalog's is set by hand
# (its own release workflow promotes the application catalog).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: v2-lab
resources: [../../base, tracing-egress.yaml]
patches:
  - path: tracing.yaml   # OTEL_* env of the five services (container 0 = the server; the migrate init container needs none)
    target: { kind: Deployment, name: "catalog|inventory|payment|notification|order" }
images:
  - name: ghcr.io/mierai/storefront-catalog
    newTag: "d654994"
  - name: ghcr.io/mierai/storefront-inventory
    newTag: "28079f6"
  - name: ghcr.io/mierai/storefront-payment
    newTag: "d654994"
  - name: ghcr.io/mierai/storefront-notification
    newTag: "28079f6"
  - name: ghcr.io/mierai/storefront-order
    newTag: "d654994"
  - name: ghcr.io/mierai/storefront-topology
    newTag: "28079f6"
