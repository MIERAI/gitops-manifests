# v2: storefront v2 as a whole on the lab (MIERAI/storefront services/{catalog,inventory,payment,notification,order},
# generated by api-factory; design docs/design/v2-microservices.md). Milestone M6 proves the four microservice promises
# here (design §0) before v1 is strangled step by step on the laptop. Format: storefront/app.yaml.
#
# One namespace v2-lab with everything the system needs: one CNPG cluster (a database and a TLS-certificate role per
# service), one RabbitMQ, the topology Job, the five services at one replica (the capacity test scales them). The name
# `v2` (not storefront-v2): the lab's sync window (platform/sync-window-lab) holds storefront-* / catalog-* back during
# the regression; v2-lab syncs at once. Lab only: platform.yaml clusters.laptop.applications.exclude: [v2].
# Entry point: order's PlaceOrder, http://order.v2-lab.svc:8080/order.order.v1.OrderService/PlaceOrder (Connect JSON).
name: v2
repo: MIERAI/storefront          # its release-<service> workflows build the images and set them in lab
signedImages: true               # signed by the shared build workflow (public repository)
namespace: { labels: { gitops-platform/image-signatures: required } }   # our signature policy (Kyverno, laptop only)
environments:
  - name: lab
components:
  - { name: v2, kustomize: overlays }   # overlays/lab/kustomization.yaml: the whole system (base/)
services:
  - { name: catalog, image: ghcr.io/mierai/storefront-catalog, component: v2 }
  - { name: inventory, image: ghcr.io/mierai/storefront-inventory, component: v2 }
  - { name: payment, image: ghcr.io/mierai/storefront-payment, component: v2 }
  - { name: notification, image: ghcr.io/mierai/storefront-notification, component: v2 }
  - { name: order, image: ghcr.io/mierai/storefront-order, component: v2 }
  - { name: topology, image: ghcr.io/mierai/storefront-topology, component: v2 }
# SLOs (gitops-platform-blueprint docs/slo.md), all from the services' own metrics (api-factory-runtime; the pod label
# `app` tells the services apart). Server errors = internal / unavailable / unknown / deadline_exceeded / data_loss;
# client errors (invalid_argument, not_found, failed_precondition) are not bad events.
#   - place-order-*: what a shopper sees — the order is accepted (PlaceOrder answered, the saga takes over).
#   - <service>-messages: each service's share of the saga — a message handled (ok, business result, duplicate) and
#     not dead-lettered (dlq: retries exhausted, poison). retry is not bad by itself (transient, retried).
#   - browse-*: catalog's read RPCs, as the application catalog's.
#   - consistency-*: every accepted order reaches a final state (CONFIRMED or CANCELLED) in time — design §0's
#     "all orders final within 5 minutes" as an SLO, from order's state-machine metrics. That stock and payments agree
#     (no oversell, no double charge) is held by the databases (CHECK available >= 0, payments keyed by order) and
#     proven by storefront scripts/m6 (check.py) in the M6 experiments, not by a metric that could only ever be 1.
slos:
  - name: place-order-availability
    description: PlaceOrder answered without a server error, as counted by order itself (rpc_requests_total). An order
      that fails later in the saga is not counted here (that is the consistency SLO's). Blind to requests that never
      reach a pod.
    objective: 99.5
    availability:
      metric: rpc_requests_total
      matchers: 'app="order", procedure="/order.order.v1.OrderService/PlaceOrder"'
      errors: 'code=~"internal|unavailable|unknown|deadline_exceeded|data_loss"'
  - name: place-order-latency
    description: PlaceOrder answered within 250ms (a bucket edge of the runtime's histogram), whatever the result. It
      writes the order and the saga's first command (outbox) in one transaction; nothing waits for the broker.
    objective: 99
    latency:
      metric: rpc_request_duration_seconds
      matchers: 'app="order", procedure="/order.order.v1.OrderService/PlaceOrder"'
      threshold: "0.25"
  - name: saga-messages
    description: order's saga handlers (OrderSaga on inventory.* / payment.* answers) handled each message without
      dead-lettering it. A rejected impossible answer (outcome dlq/poison) means the saga could not act on it.
    objective: 99.9
    availability: { metric: factory_messages_total, matchers: 'app="order"', errors: 'outcome=~"dlq|poison"' }
  - name: inventory-messages
    description: inventory's handlers (ReserveStock, CommitStock, ReleaseStock, InitStock) handled each message without
      dead-lettering it. Not enough stock is a business result (reservation_failed), not an error.
    objective: 99.9
    availability: { metric: factory_messages_total, matchers: 'app="inventory"', errors: 'outcome=~"dlq|poison"' }
  - name: payment-messages
    description: payment's ChargePayment handled each payment.charge without dead-lettering it. A declined charge is a
      business result (payment.failed), not an error.
    objective: 99.9
    availability: { metric: factory_messages_total, matchers: 'app="payment"', errors: 'outcome=~"dlq|poison"' }
  - name: notification-messages
    description: notification recorded each order.confirmed / order.cancelled without dead-lettering it.
    objective: 99.5
    availability: { metric: factory_messages_total, matchers: 'app="notification"', errors: 'outcome=~"dlq|poison"' }
  - name: browse-availability
    description: catalog's ListProducts / GetProduct answered without a server error (rpc_requests_total).
    objective: 99.9
    availability:
      metric: rpc_requests_total
      matchers: 'app="catalog", procedure=~"/catalog.catalog.v1.CatalogService/(ListProducts|GetProduct)"'
      errors: 'code=~"internal|unavailable|unknown|deadline_exceeded|data_loss"'
  - name: consistency-final-5m
    description: An order reaches CONFIRMED or CANCELLED within 5 minutes of being placed (factory_sm_completion_seconds,
      created → final, observed by order's saga when the order finishes). Normally about a second; an inventory or
      payment outage makes the orders of the outage finish late once it is over — design §0 allows 5 minutes after the
      recovery, this SLO counts from creation, so a 10-minute outage spends budget. Blind to orders that never finish
      (consistency-none-stuck sees those).
    objective: 99
    latency:
      metric: factory_sm_completion_seconds
      matchers: 'app="order", machine="OrderSaga"'
      threshold: "300.0"   # Prometheus 3 writes integer bucket edges as le="300.0" (le="300" matches nothing)
  - name: consistency-none-stuck
    description: No order has waited 5 minutes or more in one saga state (RESERVING, CHARGING, CONFIRMING, RELEASING),
      from the timeout scanner's oldest-in-state gauge (recording rule storefront:order_saga_none_stuck_5m:bool,
      v2/base/consistency.yaml). Bad while one waits — e.g. CHARGING with payment down, which by design has no deadline.
    objective: 99
    bool: { metric: "storefront:order_saga_none_stuck_5m:bool" }
