# storefront v2 on the lab, the whole system in one namespace (v2-lab): catalog, inventory, payment, notification,
# order (MIERAI/storefront services/<name>, generated by api-factory) + one CNPG cluster (a database and a role per
# service) + one RabbitMQ. Order (sync waves):
#   0  Postgres, RabbitMQ
#   1  the databases and roles (CNPG Database / DatabaseRole), the topology Job (a Sync hook: every queue, binding,
#      retry queue and DLQ of contracts/topology.json, before any service starts — api-factory GAPS G23)
#   2  the services (an init container runs each one's migrations, same image; /readyz = topology declared + every
#      consumer subscribed)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: { app.kubernetes.io/part-of: storefront-v2 }
resources: [postgres.yaml, rabbitmq.yaml, topology.yaml, services.yaml, networkpolicy.yaml, monitoring.yaml]
