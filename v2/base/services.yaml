# The five v2 services (MIERAI/storefront services/<name>, generated by api-factory), one replica each. Each gets
# only its own database credentials (a TLS client certificate, postgres.yaml), the broker (rabbitmq.yaml) and
# AUTH_MODE=none. Image tags: overlays/lab (the release-<name> workflows set them; catalog's is set by hand).
# catalog: products and prices (W1–W3); CreateProduct emits catalog.product_created → inventory's InitStock (M13)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  replicas: 1   # the capacity test scales it
  selector: { matchLabels: { app: catalog } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata: { labels: { app: catalog, storefront-v2/role: service } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      # fsGroup: the client certificate's key is readable by the service's group only (defaultMode 0440)
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: migrate   # `/server migrate up` (goose, same image): the schema before the server starts
          image: ghcr.io/mierai/storefront-catalog
          args: [migrate, up]
          env:
            - { name: DATABASE_URL, value: "postgres://catalog@postgres-rw:5432/catalog?sslmode=verify-full&sslrootcert=/pg/ca/ca.crt&sslcert=/pg/client/tls.crt&sslkey=/pg/client/tls.key" }
          volumeMounts:
            - { name: pg-client, mountPath: /pg/client, readOnly: true }
            - { name: pg-ca, mountPath: /pg/ca, readOnly: true }
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      containers:
        - name: catalog
          image: ghcr.io/mierai/storefront-catalog
          ports: [{ containerPort: 8080, name: http }, { containerPort: 9090, name: metrics }]   # the image sets PORT / METRICS_PORT
          env:
            - { name: AUTH_MODE, value: none }   # the platform authenticates: networkpolicy.yaml
            - { name: DATABASE_URL, value: "postgres://catalog@postgres-rw:5432/catalog?sslmode=verify-full&sslrootcert=/pg/ca/ca.crt&sslcert=/pg/client/tls.crt&sslkey=/pg/client/tls.key" }
            - name: AMQP_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-app, key: password } }
            - { name: AMQP_URL, value: "amqp://v2:$(AMQP_PASSWORD)@rabbitmq:5672/v2-lab" }
            # PAGE_TOKEN_KEY not set: one replica (page tokens are per process; a WARN at start-up)
          volumeMounts:
            - { name: pg-client, mountPath: /pg/client, readOnly: true }
            - { name: pg-ca, mountPath: /pg/ca, readOnly: true }
          # /readyz = the topology declared and every consumer subscribed (api-factory-runtime); neither probe pings
          # the database
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /livez, port: http }, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6 }
          resources:
            requests: { cpu: 20m, memory: 24Mi }
            limits: { memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes:
        - name: pg-client   # catalog's own database credentials only (postgres.yaml: DatabaseRole catalog)
          secret: { secretName: catalog-client-cert, defaultMode: 0440 }
        - name: pg-ca       # the server CA, to verify the server (never its key)
          secret: { secretName: postgres-ca, defaultMode: 0444, items: [{ key: ca.crt, path: ca.crt }] }
---
apiVersion: v1
kind: Service
metadata: { name: catalog }
spec:
  selector: { app: catalog }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
