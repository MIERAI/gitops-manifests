# The v2 services' message broker: one RabbitMQ node, vhost v2-lab (one vhost per environment, api-factory R4 §4.1),
# one user `v2` for all five services (per-service users: later, with a secret operator). Its password is the random one
# CNPG generated into Secret postgres-app (postgres.yaml says why; that Postgres role cannot log in).
# Durable queues on a volume: a broker restart keeps the queues and the messages in them.
# Memory: high watermark 300 MiB absolute (publishers are blocked above it, the services' outboxes keep the messages).
# It was 160 MiB: the idle node (66 queues, management + prometheus plugins) sits at ~145–165 MiB, so under 1–2 orders/s
# the alarm went on and off ~40 times in 90 min (M6, 2026-11-23); order's relay waited 10 s for confirms, ended its
# leader term, and half of the orders only moved on with the saga's 30 s resend (journey: 73% within 60 s).
# The request follows what it really uses (~145 MiB); the limit (384 Mi) stays above the watermark plus Erlang's overhead.
# Erlang schedulers limited to 2 (the node has 8 cores; one per core costs memory and idle CPU on a small lab).
# Metrics: rabbitmq_prometheus on :15692, per queue (prometheus.return_per_object_metrics: ~40 queues incl. retry/DLQ).
apiVersion: v1
kind: ConfigMap
metadata: { name: rabbitmq }
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
  20-lab.conf: |
    vm_memory_high_watermark.absolute = 300MiB
    disk_free_limit.absolute = 256MB
    prometheus.return_per_object_metrics = true
    management.rates_mode = none
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
---
apiVersion: v1
kind: Service
metadata: { name: rabbitmq-headless }
spec:
  clusterIP: None
  selector: { app: rabbitmq }
  ports: [{ name: amqp, port: 5672, targetPort: amqp }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  replicas: 1
  serviceName: rabbitmq-headless   # stable host name rabbitmq-0 = stable node name rabbit@rabbitmq-0 (its data dir)
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata: { labels: { app: rabbitmq } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, fsGroupChangePolicy: OnRootMismatch, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      # The Erlang cookie on the volume must be 0600: the fsGroup pass that kubelet runs on the volume made it group
      # readable, and the first restart (M6, 2026-11-23) crash-looped ("Cookie file … must be accessible by owner only").
      # OnRootMismatch skips that pass when the volume's root already has the group; this puts the file right whatever
      # happened before.
      initContainers:
        - name: cookie
          image: mirror.gcr.io/library/rabbitmq:3.13.7-management
          command: ["sh", "-c", "[ ! -f /var/lib/rabbitmq/.erlang.cookie ] || chmod 600 /var/lib/rabbitmq/.erlang.cookie"]
          volumeMounts: [{ name: data, mountPath: /var/lib/rabbitmq }]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      containers:
        - name: rabbitmq
          image: mirror.gcr.io/library/rabbitmq:3.13.7-management   # Docker Hub's official image through Google's cache
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: v2 }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: postgres-app, key: password } }
            - { name: RABBITMQ_DEFAULT_VHOST, value: v2-lab }
            - { name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS, value: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio none" }
          ports:
            - { containerPort: 5672, name: amqp }
            - { containerPort: 15672, name: management }
            - { containerPort: 15692, name: prometheus }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
            - { name: config, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins }
            - { name: config, mountPath: /etc/rabbitmq/conf.d/20-lab.conf, subPath: 20-lab.conf }
          # TCP probes, not rabbitmq-diagnostics: every CLI call starts an Erlang VM inside this container's memory limit
          readinessProbe: { tcpSocket: { port: amqp }, periodSeconds: 5, initialDelaySeconds: 5 }
          livenessProbe: { tcpSocket: { port: amqp }, periodSeconds: 20, initialDelaySeconds: 60, failureThreshold: 6 }
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { memory: 384Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      volumes:
        - { name: config, configMap: { name: rabbitmq } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
