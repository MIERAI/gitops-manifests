hypothesis: >-
  The API cannot reach Postgres at all (network partition between the API pods and the database pods): every RPC
  fails, users are fully down, so a page is required within 10 minutes. Prediction, written before the run: the
  in-pod rpc-availability SLO does NOT page. The readiness probe (/healthz pings the database) takes every pod out of
  the Service within ~15s, after which RPCs are refused by the Service and never counted; the ~15s of counted
  failures are well under 14x the 0.1% budget over 1h. The health probe calls /healthz through the Service, sees
  every call fail and pages after ~6.5 min (14x a 0.5% budget = 7% of the hour, 4.2 min, plus for 2m). Also
  predicted: the liveness probe (same /healthz) restarts the API containers every ~1 min, so the in-pod series
  vanish and SLOMetricAbsent (ticket) follows after ~12 min; after the fault, restart back-off delays recovery by up
  to a few minutes.
namespace: api-factory-prod
fault:
  - apiVersion: chaos-mesh.org/v1alpha1
    kind: NetworkChaos
    metadata: { name: api-factory-db-partition }
    spec:
      action: partition
      mode: all
      # Injected on the Postgres side: the API connects through the postgres-rw Service, so its packets leave the pod
      # addressed to the ClusterIP and a filter on the Postgres pod IPs never matches them (first run: injected,
      # no effect). Postgres's packets go to the API pod IPs.
      selector: { labelSelectors: { cnpg.io/cluster: postgres } }
      direction: both
      target:
        mode: all
        selector: { labelSelectors: { app: api-factory } }
      duration: 30m
timeout: 12m
expect:
  fire:
    - { alert: ErrorBudgetBurn, labels: { namespace: api-factory-prod, slo: api-factory-health-probe, severity: page, long: 1h }, within: 10m }
recover: 15m
