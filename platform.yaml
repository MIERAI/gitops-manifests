# This repository is an slo-platform instance (https://github.com/MIERAI/slo-platform, docs/configuration.md): the
# platform itself comes from the product at product.version; what is ours is here — the applications (*/app.yaml at
# the root), their experiments (experiments/), and the components only our clusters have (clusters/<name>/extras).
apiVersion: slo-platform/v1
product: { repo: https://github.com/MIERAI/slo-platform.git, version: v0.1.5 }   # upgrade = change the version
instance: { repo: https://github.com/MIERAI/gitops-manifests.git, revision: main, apps: "." }
timezone: Asia/Tokyo
language: zh
clusters:
  laptop:                          # production: k3s on the always-on HP laptop (infrastructure-live tofu/laptop)
    role: prod
    runtime: k3s
    applications: { exclude: [v2] }  # storefront v2 runs on the lab only (v2/app.yaml)
    objectStorage: none            # the object store is SeaweedFS on the host: extras (platform-object-storage)
    extras: [{ name: laptop, path: clusters/laptop/extras }]
    components:
      # traces: Tempo on the phone (outside production's request path: phone down = fewer traces, prod unaffected).
      # Grafana gets a Tempo datasource; the services that export set OTLP themselves (storefront-dev only, for now).
      tracing: { enabled: true, external: { queryUrl: "http://100.80.225.15:3200", endpoint: "http://100.80.225.15:4318" } }
      # logs: Loki on the phone (same reasoning); the collectors are extras (platform/log-shipping, lab first)
      logging: { enabled: true, external: { queryUrl: "http://100.80.225.15:3100", endpoint: "http://100.80.225.15:3100/loki/api/v1/push" } }
      monitoring:
        values:
          grafana:                 # the one Grafana: the lab's and the phone's Prometheus too (phone dashboards:
            additionalDataSources: # infrastructure-live ansible role phone_dashboards use phone-prometheus)
              - { name: "Prometheus · lab (xiaoxin)", uid: lab-prometheus, type: prometheus, access: proxy, url: "http://100.76.236.114:30087", jsonData: { timeInterval: 15s } }
              - { name: "Prometheus · phone", uid: phone-prometheus, type: prometheus, access: proxy, url: "http://100.80.225.15:9090", jsonData: { timeInterval: 15s } }
              # the long-term store on the phone (a second Prometheus, 1 y / 150 GB): the clusters remote_write there
              - { name: "Prometheus · long-term (phone)", uid: longterm-prometheus, type: prometheus, access: proxy, url: "http://100.80.225.15:9091", jsonData: { timeInterval: 15s } }
  lab:                             # the lab: k3s on xiaoxin (7 GB) — experiments and the daily regression run here
    role: lab
    runtime: k3s
    objectStorage: none            # in-cluster SeaweedFS for the backup experiments: extras (platform-object-storage)
    extras: [{ name: lab, path: clusters/lab/extras }]
    # 2026-11-23: storefront v1 left the lab to make room for storefront v2 (the laptop keeps v1). Its experiments
    # (regression.experiments, paused) still name storefront-*: move or skip them before the regression resumes.
    # 2026-11-23: catalog runs dev only here (slo-platform v0.1.3). Its staging/prod were copies of the laptop's with no
    # traffic (SLI-absent tickets) and ~350Mi of requests on a node at 86%; promotions go through the repository, not
    # the lab. dev stays as the target of catalog fault experiments.
    # 2026-11-23: the lab is the functional / fault-experiment lab, no production replicas (ENVIRONMENTS.md 角色与范围):
    # api-factory runs dev only, sample-app not at all. Experiments that name api-factory-prod / sample-app-* (paused
    # regression) must be moved to the dev namespaces or skipped before the regression resumes.
    applications:
      exclude: [storefront, sample-app]        # needs v0.1.2 running on both roots (older schemas reject the key)
      environments:                            # needs v0.1.3 running on both roots
        catalog: { exclude: [staging, prod] }
        api-factory: { exclude: [prod] }
    components:
      monitoring:
        values:
          grafana: { enabled: false }   # 7 GB: results are files and metrics, no Grafana here
          # Long-term copy on the phone (~/promlt: 1 y / 150 GB): remote_write with a small queue. Prometheus reads it
          # from its WAL in the background — the phone down never blocks scraping or rules; after ~2 h (the WAL) the
          # unsent samples are dropped. Label cluster=lab on the copy only. Not sent: the API server's and the
          # control plane's internals (job apiserver ~35k of ~68k series; workqueue / scheduler / kine / storage /
          # runtime histograms; CNPG settings) — causes for a live look, not for a year.
          prometheus:
            prometheusSpec:
              remoteWrite:
                - url: http://100.80.225.15:9091/api/v1/write
                  remoteTimeout: 30s
                  queueConfig: { capacity: 2500, maxShards: 2, minShards: 1, maxSamplesPerSend: 1000, batchSendDeadline: 10s, minBackoff: 1s, maxBackoff: 1m }
                  writeRelabelConfigs:
                    - { action: drop, sourceLabels: [job], regex: apiserver }
                    - { action: drop, sourceLabels: [__name__], regex: "(workqueue|scheduler|kine|storage_operation|kubelet_runtime_operations|rest_client|cnpg_pg_settings)_.*" }
                    - { action: replace, targetLabel: cluster, replacement: lab }
          # The lab's dead man's switch, like the laptop's notify.deadman (which the product applies to prod only:
          # a lab notifies nobody): Watchdog → the phone's watcher every minute (gitops_watch check lab-watchdog);
          # every other alert still goes to "null". Merged over the platform's config: route.routes is added,
          # receivers (a list) replaced — keep "null" in it.
          alertmanager:
            config:
              route:
                routes:
                  - { receiver: deadman, matchers: ['alertname="Watchdog"'], group_wait: 0s, group_interval: 1m, repeat_interval: 1s }
              receivers:
                - { name: "null" }
                - { name: deadman, webhook_configs: [{ url: "http://100.80.225.15:9195/lab-watchdog", send_resolved: false }] }
optional: { policies: false }      # our own Kyverno policies (GHCR pull secret clone, signatures): extras on the laptop
applications:
  namespaceLabels:                 # what our policies (platform/policies) select
    gitops-platform/policies: enforced
    gitops-platform/ghcr-pull: "true"
components:
  monitoring:
    values:
      prometheus:
        prometheusSpec:            # the volume was created with 15Gi: a volume claim template cannot shrink
          retentionSize: 12GB
          storageSpec:
            volumeClaimTemplate:
              spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 15Gi } } }
grafana: { adminSecret: grafana-admin }
# PAUSED 2026-11-22: the factory comes first (owner's call) — Feb 31 never comes, so the daily regression does not run;
# restore "0 9 * * *" to resume. (The lab's SLOExperimentRegressionStale ticket fires meanwhile; the lab notifies nobody.)
regression: { schedule: "0 9 31 2 *", experiments: experiments }
notify:                            # prod only (the lab notifies nobody)
  page:   [{ type: webhook, url: "http://alert-speaker.alert-speaker.svc:8080/" }]   # the laptop's speakers
  ticket: [{ type: webhook, url: "http://alert-speaker.alert-speaker.svc:8080/" }]
  deadman: { url: "http://100.80.225.15:9195/watchdog", interval: 1m }   # the phone's watcher (gitops_watch)
