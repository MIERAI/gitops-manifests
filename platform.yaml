# This repository is an slo-platform instance (https://github.com/MIERAI/slo-platform, docs/configuration.md): the
# platform itself comes from the product at product.version; what is ours is here — the applications (*/app.yaml at
# the root), their experiments (experiments/), and the components only our clusters have (clusters/<name>/extras).
apiVersion: slo-platform/v1
product: { repo: https://github.com/MIERAI/slo-platform.git, version: v0.1.3 }   # upgrade = change the version
instance: { repo: https://github.com/MIERAI/gitops-manifests.git, revision: main, apps: "." }
timezone: Asia/Tokyo
language: zh
clusters:
  laptop:                          # production: k3s on the always-on HP laptop (infrastructure-live tofu/laptop)
    role: prod
    runtime: k3s
    applications: { exclude: [v2] }  # storefront v2 runs on the lab only (v2/app.yaml)
    objectStorage: none            # the object store is SeaweedFS on the host: extras (platform-object-storage)
    extras: [{ name: laptop, path: clusters/laptop/extras }]
    components:
      monitoring:
        values:
          grafana:                 # the one Grafana: the lab's and the phone's Prometheus too (phone dashboards:
            additionalDataSources: # infrastructure-live ansible role phone_dashboards use phone-prometheus)
              - { name: "Prometheus · lab (xiaoxin)", uid: lab-prometheus, type: prometheus, access: proxy, url: "http://100.76.236.114:30087", jsonData: { timeInterval: 15s } }
              - { name: "Prometheus · phone", uid: phone-prometheus, type: prometheus, access: proxy, url: "http://100.80.225.15:9090", jsonData: { timeInterval: 15s } }
  lab:                             # the lab: k3s on xiaoxin (7 GB) — experiments and the daily regression run here
    role: lab
    runtime: k3s
    objectStorage: none            # in-cluster SeaweedFS for the backup experiments: extras (platform-object-storage)
    extras: [{ name: lab, path: clusters/lab/extras }]
    # 2026-11-23: storefront v1 left the lab to make room for storefront v2 (the laptop keeps v1). Its experiments
    # (regression.experiments, paused) still name storefront-*: move or skip them before the regression resumes.
    applications: { exclude: [storefront] }   # needs v0.1.2 running on both roots (older schemas reject the key)
    components:
      monitoring: { values: { grafana: { enabled: false } } }   # 7 GB: results are files and metrics, no Grafana here
optional: { policies: false }      # our own Kyverno policies (GHCR pull secret clone, signatures): extras on the laptop
applications:
  namespaceLabels:                 # what our policies (platform/policies) select
    gitops-platform/policies: enforced
    gitops-platform/ghcr-pull: "true"
components:
  monitoring:
    values:
      prometheus:
        prometheusSpec:            # the volume was created with 15Gi: a volume claim template cannot shrink
          retentionSize: 12GB
          storageSpec:
            volumeClaimTemplate:
              spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 15Gi } } }
grafana: { adminSecret: grafana-admin }
# PAUSED 2026-11-22: the factory comes first (owner's call) — Feb 31 never comes, so the daily regression does not run;
# restore "0 9 * * *" to resume. (The lab's SLOExperimentRegressionStale ticket fires meanwhile; the lab notifies nobody.)
regression: { schedule: "0 9 31 2 *", experiments: experiments }
notify:                            # prod only (the lab notifies nobody)
  page:   [{ type: webhook, url: "http://alert-speaker.alert-speaker.svc:8080/" }]   # the laptop's speakers
  ticket: [{ type: webhook, url: "http://alert-speaker.alert-speaker.svc:8080/" }]
  deadman: { url: "http://100.80.225.15:9195/watchdog", interval: 1m }   # the phone's watcher (gitops_watch)
